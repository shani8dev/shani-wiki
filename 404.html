<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Shanios Wiki</title>
    <meta name="robots" content="noindex">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self'">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous">
    <style>
        .not-found {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .not-found img { width: 120px; height: 120px; margin-bottom: 1.5rem; }
        .not-found h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .not-found p { max-width: 32rem; margin-bottom: 2rem; }
        .not-found a.home-link {
            background: var(--primary);
            color: #1a102f;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="not-found">
        <img src="assets/images/logo.svg" alt="Shanios Logo">
        <h1>404 — Page Not Found</h1>
        <p>This wiki is a single page — every topic lives at an anchor on the home page, not its own URL. The link you followed may be old or mistyped.</p>
        <a class="home-link" href="/">Back to the Shanios Wiki</a>
    </div>
</body>
</html>
